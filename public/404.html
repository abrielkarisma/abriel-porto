<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Base path repo ini di GitHub Pages.
        // '/abriel-porto/' untuk project site (username.github.io/<repo>).
        // '/' kalau dipakai di domain sendiri yang root-nya langsung repo ini.
        var BASE_PATH = '/abriel-porto/';

        var l = window.location;
        var rest = l.pathname.indexOf(BASE_PATH) === 0
            ? l.pathname.slice(BASE_PATH.length - 1)
            : l.pathname;

        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            BASE_PATH + '?/' + rest.replace(/^\//, '').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
    <p>Redirecting to the correct page...</p>
</body>

</html>
